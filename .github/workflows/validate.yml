name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a hassfest rule change shows up before a release does.
    - cron: "0 19 * * 1"

jobs:
  payload:
    name: Generated component
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate the synced component
        run: python scripts/validate.py

      - name: Check the validator still refuses broken copies
        run: python scripts/test_validate.py

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
